<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Demo walkthrough storyboard">
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="40" y="60" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">3-Step Demo Walkthrough</text>
  <rect x="40" y="100" width="390" height="560" rx="18" fill="#111827" stroke="#334155"/>
  <text x="70" y="145" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">1. Authenticate</text>
  <text x="70" y="190" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">Open login page and sign in.</text>
  <rect x="70" y="220" width="330" height="190" rx="12" fill="#1f2937"/>
  <text x="95" y="280" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Email + Password</text>
  <text x="95" y="320" fill="#22d3ee" font-family="Segoe UI, Arial, sans-serif" font-size="18">JWT token issued</text>
  <rect x="445" y="100" width="390" height="560" rx="18" fill="#111827" stroke="#334155"/>
  <text x="475" y="145" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">2. Communicate</text>
  <text x="475" y="190" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">Send emoji/text or use webcam gesture mode.</text>
  <rect x="475" y="220" width="330" height="190" rx="12" fill="#1f2937"/>
  <text x="500" y="280" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28">👋 🙋 ❓</text>
  <text x="500" y="320" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="18">intent_agent -> ask_question</text>
  <rect x="850" y="100" width="390" height="560" rx="18" fill="#111827" stroke="#334155"/>
  <text x="880" y="145" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">3. Observe Output</text>
  <text x="880" y="190" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">Read translated response and workflow logs.</text>
  <rect x="880" y="220" width="330" height="190" rx="12" fill="#1f2937"/>
  <text x="905" y="280" fill="#22d3ee" font-family="Segoe UI, Arial, sans-serif" font-size="16">"I understand your question.</text>
  <text x="905" y="305" fill="#22d3ee" font-family="Segoe UI, Arial, sans-serif" font-size="16">Let's solve it together."</text>
  <text x="905" y="345" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">conversation persisted</text>
</svg>
