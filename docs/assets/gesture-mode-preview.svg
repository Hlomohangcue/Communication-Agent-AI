  <text x="880" y="275" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">👎 thumbs_down</text>
  <text x="880" y="305" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">✌️ peace</text>
  <text x="880" y="335" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">👌 ok</text>
  <text x="880" y="365" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">✋ stop</text>
  <text x="880" y="395" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">🙋 raised_hand</text>
  <text x="880" y="425" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">🤟 i_love_you</text>
