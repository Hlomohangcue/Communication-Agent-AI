  <text x="370" y="350" fill="#22d3ee" font-family="Segoe UI, Arial, sans-serif" font-size="22">Interpreted Meaning: affection and support</text>
  <text x="370" y="395" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="20">Response: "I care about you too. I'm here to help."</text>
  <rect x="75" y="590" width="170" height="45" rx="10" fill="#2563eb"/>
