<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Gesture mode preview">
  <rect width="1280" height="720" fill="#0b1020"/>
  <rect x="40" y="35" width="1200" height="70" rx="14" fill="#131a2e" stroke="#2b3655"/>
