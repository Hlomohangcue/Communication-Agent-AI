  <rect x="260" y="590" width="170" height="45" rx="10" fill="#16a34a"/>
  <text x="286" y="620" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Capture</text>
  <rect x="850" y="125" width="390" height="535" rx="18" fill="#111827" stroke="#374151"/>
  <text x="880" y="170" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Supported Gestures</text>
  <text x="880" y="215" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16">👋 wave</text>
